# Cross-platform CI matrix. Runs the full test suite under each supported
# Node + platform combination, so a Linux/macOS/Windows or x86/arm64 regression
# is caught by CI rather than by hand.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner label pins its own architecture. Do NOT use setup-node's
        # `architecture` input to request a foreign arch: it only selects which
        # Node *binary* to download, so pairing ubuntu-latest (x64) with arm64
        # installs an arm64 ELF that cannot exec on the x64 runner and `npm ci`
        # dies with "Syntax error: word unexpected".
        os:
          - ubuntu-latest      # Linux x64
          - ubuntu-24.04-arm   # Linux arm64 (native)
          - macos-15-intel     # macOS x64 (native Intel)
          - windows-latest     # Windows x64
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
        continue-on-error: true

  macos-arm64:
    # GitHub's hosted macOS arm64 runners frequently fail to acquire. Keep
    # coverage visible, but do not gate PRs on infrastructure we cannot control.
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  portability:
    # Confirms the published package contains no native binaries and that the
    # runtime dependency tree is pure JavaScript on every platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: No native binaries shipped
        run: node scripts/check-portable.mjs