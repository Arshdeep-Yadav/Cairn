name: Feature Request
description: Propose an idea or enhancement for Cairn
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We appreciate suggestions for new capabilities, MCP tools, and agent integrations!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or workflow limitation?
      placeholder: I am frustrated when ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like Cairn to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
